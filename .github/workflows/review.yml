# 경기 리뷰 자동 발행
#
# 끝난 경기의 기록을 모아 리뷰 글을 쓰고 워드프레스(barosportstv.com)에 올린다.
# 실행기는 tools/review/run.mjs 다. 비밀값은 전부 Secret 에만 있고 여기서만 쓰인다.
name: review

on:
  schedule:
    # 하루 48회. 정각·30분은 GitHub 이 부하 때 늦추거나 건너뛰므로(deploy.yml 주석 참고)
    # 붐비지 않는 19·49분을 쓴다. deploy.yml 의 7·37분과도 겹치지 않는다.
    - cron: '19,49 * * * *'
  workflow_dispatch:
    inputs:
      dry:
        description: '글을 올리지 않고 요약만 본다 (워드프레스·Anthropic 호출 없음)'
        type: boolean
        default: false
      league:
        description: '한 리그만 (kbo|kl1|kbl|wkbl|vm|vw). 비우면 전부'
        type: string
        default: ''
      since:
        description: '이 날짜부터 훑는다 (YYYY-MM-DD). 비우면 기본 범위'
        type: string
        default: ''

permissions:
  contents: read

# 겹쳐 돌면 같은 경기를 두 실행이 동시에 보고 글을 두 번 올린다.
# 중복 확인(slug 조회)과 글쓰기 사이에 틈이 있으므로 실행을 줄 세운다.
# 진행 중인 것은 끝까지 두고, 기다리는 것만 최신 하나로 남는다.
concurrency:
  group: review
  cancel-in-progress: false

jobs:
  review:
    # 예약 실행은 저장소 변수 REVIEW_SCHEDULE 이 'on' 일 때만 일한다.
    # 왜: 이 파일이 main 에 들어가는 순간부터 예약이 돌기 시작한다. 그런데 대표 이미지
    # 배경 선택과 테마 0.3.0 업로드가 끝나기 전에는 공개 발행을 하면 안 된다.
    # 그래서 기본은 꺼 두고(변수 없음), 준비가 끝나면
    #   gh variable set REVIEW_SCHEDULE --body on
    # 으로 켠다. 손으로 실행(workflow_dispatch)은 변수와 상관없이 언제나 된다.
    if: github.event_name == 'workflow_dispatch' || vars.REVIEW_SCHEDULE == 'on'
    runs-on: ubuntu-latest
    # 한 회차 새 글 12편 상한 + 네이버·공식 사이트 요청 간격을 감안한 여유.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: 단위 테스트
        run: npm test

      - name: 경기 리뷰 실행
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # KBO 기록은 TheSportsDB 에서만 받는다(run.mjs 가 SPORTSDB_KEY 를 읽는다).
          SPORTSDB_KEY: ${{ secrets.SPORTSDB_KEY }}
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          # 입력값은 ${{ }} 를 셸 본문에 직접 끼우지 않고 환경변수로 넘긴다(명령 주입 방지).
          # 예약 실행에는 inputs 가 없어 빈 값이 되고, 그러면 옵션을 붙이지 않는다.
          IN_DRY: ${{ inputs.dry }}
          IN_LEAGUE: ${{ inputs.league }}
          IN_SINCE: ${{ inputs.since }}
        run: |
          args=()
          if [ "$IN_DRY" = "true" ]; then args+=(--dry); fi
          if [ -n "$IN_LEAGUE" ]; then args+=(--league "$IN_LEAGUE"); fi
          if [ -n "$IN_SINCE" ]; then args+=(--since "$IN_SINCE"); fi
          node tools/review/run.mjs "${args[@]}"
