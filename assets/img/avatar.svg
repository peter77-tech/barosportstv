<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="내 계정">
<!-- 기본 프로필 이미지. 실제 인물 사진을 쓰지 않는다 (모델 릴리스 문제).
     브랜드 팔레트(apex-blue 배경 · hermes-orange 강조)로 만든 그래픽이다. -->
<defs>
  <linearGradient id="av-bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1B4D94"/>
    <stop offset="100%" stop-color="#0F2B54"/>
  </linearGradient>
  <linearGradient id="av-glow" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff" stop-opacity=".18"/>
    <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="96" height="96" fill="url(#av-bg)"/>
<rect width="96" height="48" fill="url(#av-glow)"/>
<!-- 사람 실루엣 -->
<circle cx="48" cy="37" r="14" fill="#ffffff" fill-opacity=".92"/>
<path d="M48 56c-14.4 0-26 8.9-26 19.9V96h52V75.9C74 64.9 62.4 56 48 56Z" fill="#ffffff" fill-opacity=".92"/>
<!-- 브랜드 강조선 -->
<rect x="0" y="90" width="96" height="6" fill="#E85110"/>
</svg>
